<h:form id="loginFormId" 
	xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
   	xmlns:p="http://primefaces.org/ui">

	<p:messages id="failure" showDetail="false" autoUpdate="true" closable="true" />

	<p:panelGrid columns="2" styleClass="ui-noborder">
	
		<f:facet name="header">
			#{um['i18n.login.area']}
		</f:facet>
		
    	<h:outputLabel value="#{um['i18n.username.label']}" for="usernameId" />
    	<p:inputText id="usernameId"
                value="#{MB.username}" 
				title="#{um['i18n.username.label']}"
                actionListener="#{MB.loginListener}" 
              	required="true"
              	requiredMessage="#{um['i18n.user.name.message']}" />

    	<h:outputLabel value="#{um['i18n.password.label']}" for="password-id" />
    	<p:password id="password-id"
                value="#{MB.password}" 
				title="#{um['i18n.password.label']}"
				actionListener="#{MB.loginListener}" 
              	required="false"
              	requiredMessage="#{um['i18n.user.password.message']}"/>

		<f:facet name="footer">
			<p:commandButton id="loginButtonId"
				icon="ui-icon-check"
				actionListener="#{MB.loginListener}" 
				value="#{um['i18n.login.button.label']}" 
				title="#{um['i18n.login.button.title']}"
				ajax="false"/>
		</f:facet>
		
  	</p:panelGrid>

	<script type="text/javascript">document.getElementById('loginFormId:usernameId').focus();</script>       		

</h:form>
