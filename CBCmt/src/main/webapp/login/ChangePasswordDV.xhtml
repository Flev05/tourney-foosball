<h:panelGroup styleClass="erpComponentBox"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
				xmlns:p="http://primefaces.org/ui">

	<p:panel styleClass="textAlignCenter">
	    <h:outputText value="#{um['i18n.user.changepassword.synopsis']}"/>
	</p:panel>

    <h:form id="saveFormId">
    	<p:messages id="failure" showDetail="false" autoUpdate="true" closable="true" />
    
       	<p:confirmDialog global="true" showEffect="fade" hideEffect="explode">
        	<p:commandButton value="#{um['i18n.accept.label']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
        	<p:commandButton value="#{um['i18n.deny.label']}"   type="button" styleClass="ui-confirmdialog-no"  icon="ui-icon-close" />
		</p:confirmDialog>
    
		<p:panel id="changePasswprdId">
	        <h:panelGrid columns="3" styleClass="contentAlignCenter">
	       		<h:outputLabel for="usernameForChangePwdId" value="#{um['i18n.username.label']} "/>
	            <h:outputText id="usernameForChangePwdId" 
		            value="#{ChangePasswordDV.vo.username}"
		            style="color: green;"/>
            	<p:message for="usernameForChangePwdId"/>
	
	            <h:outputLabel for="passwordForChangePwdId" value="#{um['i18n.oldpassword.label']}(*)"/>
	            <p:password id="passwordForChangePwdId" value="#{ChangePasswordDV.vo.retypePassword}">
	            </p:password>
            	<p:message for="passwordForChangePwdId"/>
	
	            <h:outputLabel for="newPasswordId" value="#{um['i18n.newpassword.label']}(*)"/>	
	            <p:password id="newPasswordId"
	                           value="#{ChangePasswordDV.vo.newPassword}"
	                           required="#{not empty param['saveFormId:saveButtonId']}"
	                           requiredMessage="#{um['i18n.confirmpassword.message']}"
	                           actionListener="#{ChangePasswordDV.save}">
	            </p:password>
            	<p:message for="newPasswordId"/>
	        
	            <h:outputLabel for="confirmPasswordId" value="#{um['i18n.confirmpassword.label']}(*)"/>
	            <p:password id="confirmPasswordId"
	                           value="#{ChangePasswordDV.vo.confirmPassword}"
	                           partialSubmit="false"
	                           required="#{not empty param['saveFormId:saveButtonId']}"
	                           requiredMessage="#{um['i18n.common.field.mandatory']}"
	                           actionListener="#{ChangePasswordDV.save}">
	            </p:password>
	            <p:message for="confirmPasswordId"/>
	        </h:panelGrid>
		</p:panel>
	
		<script type="text/javascript">document.getElementById('saveFormId:saveButtonId').focus();</script> 
	
		<p:panel>
	        <h:panelGrid columns="5" styleClass="contentAlignCenter">
		        <p:commandButton id="backButtonId"
		         	actionListener="#{ChangePasswordDV.cancel}"
		         	icon = "fa fa-arrow-left"
					title="#{um['i18n.button.back.tooltip']}" />
		
				<p:commandButton id="saveButtonId"
						title="#{um['i18n.button.save.tooltip']}"
						value="#{um['i18n.button.save.label']}"
					   	actionListener="#{ChangePasswordDV.save}"
					   	update="changePasswprdId"/>
			</h:panelGrid >
		</p:panel>
		
	</h:form>	
</h:panelGroup>
