<h:panelGroup xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

<h:form id="dataTableFormId">
   	<p:messages id="failure" showDetail="false" autoUpdate="true" closable="true" />

	<p:dataTable id="bookingDataTableId" 
			var="vo" 
			value="#{ResetPasswordLV.voList}"
            selectionMode="single"     
            rowKey="#{vo.id}">

        <f:facet name="header">
        	#{um['i18n.user.resetpassword.label']}
        </f:facet>
		
		<p:ajax event="rowSelect" listener="#{ResetPasswordLV.onRowSelect}" />
        
        <p:column headerText="#{um['i18n.person.firstname.column']}">
            <h:outputText id="firstname"  rendered="#{not vo.selected}" value="#{vo.firstname}"/>
            <h:inputText id="firstnameIn" rendered="#{vo.selected}" value="#{vo.firstname}"/>
        </p:column>

        <p:column headerText="#{um['i18n.person.lastname.column']}">
            <h:outputText id="lastname"  rendered="#{not vo.selected}" value="#{vo.lastname}"/>
            <h:inputText id="lastnameIn" rendered="#{vo.selected}" value="#{vo.lastname}"/>
        </p:column>

        <p:column headerText="#{um['i18n.table.column.username']}">
            <h:outputText id="username"  rendered="#{not vo.selected}" value="#{vo.username}"/>
            <h:inputText id="usernameIn" rendered="#{vo.selected}" value="#{vo.username}"/>
        </p:column>
	
	</p:dataTable>
		
</h:form>
</h:panelGroup>
