<h:panelGroup xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

<p:panel style="text-align: left;">
	<h:outputText value="#{um['i18n.activitylog.header']}"/>
</p:panel>

<!-- Page description area -->
<h:form id="backFormId">
	<p:panel>
		<h:panelGrid columns="2">

	        <h:outputLabel for="activitylogBeginDateId" value="#{um['i18n.activitylog.begindate']}: "/>
	        <p:calendar id="activitylogBeginDateId" 
	        		value="#{activityLogLV.beginDate}"
	             	timeZone="#{activityLogLV.timeZone}"
	                pattern="#{um['i18n.lms.formatdatetime']}"
	                renderAsPopup="true"
	                required="true">
         	</p:calendar>
         		
	        <h:outputLabel for="activitylogEndDateId" value="#{um['i18n.activitylog.enddate']}: "/>
	        <p:calendar id="activitylogEndDateId" 
	        		value="#{activityLogLV.endDate}"
	             	timeZone="#{activityLogLV.timeZone}"
	                pattern="#{um['i18n.lms.formatdatetime']}"
	                renderAsPopup="true"
	                required="true">
         	</p:calendar>
         		
	       	<h:commandButton id="searchButtonId" 
	       		actionListener="#{activityLogLV.search}"
	       		value="#{um['i18n.activitylog.search.label']}"
	       		title="#{um['i18n.activitylog.search.tooltip']}"
	       		styleClass="art-button"/>

    	</h:panelGrid>
    </p:panel>
</h:form>
	
<h:form id="dataTableFormId">

	<p:dataTable id="bookingDataTableId" 
			var="vo" 
			value="#{activityLogLV.voList}"
            paginator="true" 
            rows="10" 
            rowsPerPageTemplate="25,50,100">
        		       	
        <p:column style="width: 40mm;">
            <f:facet name="header">
                <h:outputText value="#{um['i18n.activitylog.date']}" />
            </f:facet>
            <h:outputText value="#{vo.creationDate}" />
        </p:column>

        <p:column style="width: 20mm;">
            <f:facet name="header">
                <h:outputText value="#{um['i18n.activitylog.username']}" />
            </f:facet>
            <h:outputText value="#{vo.username}" />
        </p:column>

        <p:column>
            <f:facet name="header">
                <h:outputText value="#{um['i18n.activitylog.jpql']}" />
            </f:facet>
			<p:inputTextarea id="jpqlId" value="#{vo.statement}" rows="5" cols="60" autoResize="false"/>
        </p:column>
	
    </p:dataTable>
		
</h:form>
</h:panelGroup>
