<h:panelGroup xmlns="http://www.w3.org/1999/xhtml"
          xmlns:h="http://java.sun.com/jsf/html"
          xmlns:f="http://java.sun.com/jsf/core"
          xmlns:p="http://primefaces.org/ui"
          rendered="#{not UserPermissionMB.userLogged}">

<p:messages id="failure" showDetail="false" autoUpdate="true" closable="true" />

	<h:panelGrid columns="1" styleClass="contentAlignCenter">
     	<h:outputLabel value="#{um['i18n.username.label']}" for="usernameId"/>
        <p:inputText id="usernameId" 
        		classType="usernameClassType"
              	value="#{UserPermissionMB.username}"
              	required="#{not empty param['loginFormId:j_idt26:loginButtonId']}"
              	requiredMessage="#{um['i18n.user.name.message']}">
       	</p:inputText>
        <p:message  for="usernameId"/>
              				      
     	<h:outputLabel value="#{um['i18n.password.label']}" for="passwordId"/>
     	<p:password id="passwordId" 
     				secret="true" 
     				classType="usernameClassType"
                    value="#{UserPermissionMB.password}" 
					title="#{um['i18n.password.label']}"
					required="#{not empty param['loginFormId:j_idt26:loginButtonId']}"
	              	requiredMessage="#{um['i18n.user.name.message']}">
        </p:password>
        <p:message  for="passwordId"/>
	</h:panelGrid>
	
	<script type="text/javascript">document.getElementById('loginFormId:usernameId').focus();</script>     

 	<p:commandButton id="loginButtonId" 
 		actionListener="#{UserPermissionMB.loginListener}" 
 		value="#{um['i18n.login.button.label']}" 
 		title="#{um['i18n.login.button.title']}"/>

	<p:message for="loginButtonId"/>
	
</h:panelGroup>
