<h:panelGroup xmlns="http://www.w3.org/1999/xhtml"
          	xmlns:h="http://java.sun.com/jsf/html"
          	xmlns:f="http://java.sun.com/jsf/core"
      		xmlns:p="http://primefaces.org/ui"
          	xmlns:ui="http://java.sun.com/jsf/facelets"
          	id="navigationMenuForm">

<!-- SEARCH section navigator -->
<h:form id="loginFormId">     
	<p:accordionPanel activeIndex="#{UserPermissionMB.activeIndex}">
	
		<!-- USER section navigator -->
		<p:tab title="#{um['i18n.user.navigator.label']}" >
	 		<h:panelGrid columns="1">	
			   	<p:commandLink value="#{um['i18n.role.roletype.name']}" 		action="#{RoleTypeELV.load}"/>
			
			   	<p:commandLink value="#{um['i18n.user.full.role.label']}" 		action="#{FullRoleLV.load}"/>
			
			   	<p:commandLink value="#{um['i18n.resource.label']}" 			action="#{ResourceELV.load}"/>
			
			   	<p:commandLink value="#{um['i18n.permission.label']}" 			action="#{PermissionLV.load}"/>
			
			   	<p:commandLink value="#{um['i18n.user.navigator.lv.label']}" 	action="#{UserLV.load}"/>
			
			   	<p:commandLink value="#{um['i18n.user.resetpassword.label']}" 	action="#{ResetPasswordLV.load}"/>
		   	</h:panelGrid>
		</p:tab>
	
		<!-- USER LOGIN section navigator -->
		<p:tab title="#{um['i18n.mypassword.label']}" >
		    <p:commandLink value="#{um['i18n.user.navigator.changepassword.label']}" action="#{ChangePasswordDV.loadForChangePassword}"/>
		</p:tab>
		
		<p:tab title="#{um['i18n.logout.collapsible.label']}" rendered="#{UserPermissionMB.userLogged}">
		    <p:commandLink value="#{um['i18n.logout.label']}" action="#{UserPermissionMB.logout}"/>
		</p:tab>
	
	</p:accordionPanel>
</h:form>
</h:panelGroup>
