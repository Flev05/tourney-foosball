<h:panelGroup
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

<p:panelGrid columns="3" styleClass="ui-panelgrid-blank">
	<f:facet name="header">
		#{um['i18n.company.dv.synopsis']}
	</f:facet>

	<h:outputLabel for="companyNameId" value="#{um['i18n.company.name']}*"/>
    <p:inputText id="companyNameId" 
	    	value="#{MB.vo.name}" 
	    	required="true"
	    	requiredMessage="#{um['i18n.company.name.message']}"
	    	styleClass="companyTextBox">
	</p:inputText>
    <p:message for="companyNameId"/>

	<h:outputLabel for="companyCodeId" value="#{um['i18n.company.code']}:"/>
    <p:inputText id="companyCodeId" 
	    	value="#{MB.vo.companyCode}" 
	    	requiredMessage="#{um['i18n.company.code.message']}"
	    	styleClass="companyTextBox">
	</p:inputText>	    	
  	<p:message for="companyCodeId"/>

	<h:outputLabel for="addressInputTextId" value="#{um['i18n.company.address']}*"/>
	<p:inputText id="addressInputTextId" 
	    	value="#{MB.vo.address}" 
	    	required="true"
	    	requiredMessage="#{um['i18n.company.address.message']}"
	    	styleClass="companyUrlTextBox">
	</p:inputText>
	<p:message for="addressInputTextId"/>
            	 			 
	<h:outputLabel for="phonenumberInputTextId" value="#{um['i18n.company.phonenumber']}*"/>
	<p:inputText id="phonenumberInputTextId" 
			value="#{MB.vo.phoneNumber}"
			required="true"
			requiredMessage="#{um['i18n.company.phonenumber.message']}"
			styleClass="companyTextBox">
	</p:inputText>
    <p:message for="phonenumberInputTextId" />
	
	<h:outputLabel for="emailInputTextId" value="#{um['i18n.company.email']}*"/>
	<p:inputText id="emailInputTextId" 
			value="#{MB.vo.companyEmail}"
			required="true"
			requiredMessage="#{um['i18n.company.email.message']}"
			styleClass="companyTextBox">
	</p:inputText>
    <p:message for="emailInputTextId" />
                      
    <h:outputLabel for="vatlInputTextId" value="#{um['i18n.company.vat']}*"/>
	<p:inputText id="vatlInputTextId" 
			value="#{MB.vo.vat}"
			required="true"
			requiredMessage="#{um['i18n.company.vat.message']}"
			styleClass="companyTextBox">
	</p:inputText>
    <p:message for="vatlInputTextId" />	            
          
	<h:outputLabel for="taxcodeInputTextId" value="#{um['i18n.company.taxcode']}"/>
	<p:inputText id="taxcodeInputTextId" 
			value="#{MB.vo.taxCode}"
			requiredMessage="#{um['i18n.company.taxcode.message']}"
	    	styleClass="companyTextBox">
	</p:inputText>
   	<p:message for="taxcodeInputTextId" />	            
</p:panelGrid>
 
</h:panelGroup>
