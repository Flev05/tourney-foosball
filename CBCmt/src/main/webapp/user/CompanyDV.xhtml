<h:panelGroup
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

<p:panel styleClass="textAlignCenter">
	<h:outputText value="#{um['i18n.company.dv.synopsis']}"/>
</p:panel>
	
<p:panel>
    <h:panelGrid columns="1" styleClass="contentAlignCenter">
		<p:commandButton icon="fa fa-arrow-left"
			value="#{um['i18n.button.back.label']}"
			title="#{um['i18n.button.back.tooltip']}"
			actionListener="#{CompanyDV.backPage}" />
    </h:panelGrid>
</p:panel>
		
<h:form id="saveFormId">   
	<ui:include src="AbstractCompanyDV.xhtml">
	    <ui:param name="MB" value="#{CompanyDV}" />
	</ui:include>	
 
	<p:panel>
	    <h:panelGrid columns="2" styleClass="contentAlignCenter">

			<p:commandButton rendered="#{not CompanyDV.newCompany}"
					icon="fa fa-remove"
					title="#{um['i18n.button.remove.tooltip']}"
					actionListener="#{CompanyDV.delete}">
			   	<p:confirm header="#{um['i18n.confirm.title']}" message="#{um['i18n.delete.confirm.message']}" icon="ui-icon-alert" />
			</p:commandButton>

	        <p:commandButton icon="fa fa-save"
					title="#{um['i18n.button.save.tooltip']}"
	               	actionListener="#{CompanyDV.save}"
	               	update="saveFormId">
	        </p:commandButton>
	    </h:panelGrid>
	</p:panel>
</h:form>	   

</h:panelGroup>
