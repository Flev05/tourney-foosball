<h:panelGroup xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">

<h:form id="dataTableFormId">
	<p:panelGrid columns="1" styleClass="contentAlignCenter">
		<p:commandButton icon = "fa fa-plus"
				title="#{um['i18n.permission.new.tooltip']}"
		        actionListener="#{PermissionLV.loadForNew}"/>
	</p:panelGrid>

	<p:dataTable id="userDataTableId" 
		var="vo" 
		value="#{PermissionLV.voList}"
        selectionMode="single"     
        rowKey="#{vo.id}">

       	<f:facet name="header">
       		#{um['i18n.permission.header.lv']}
       	</f:facet>
	
		<p:ajax event="rowSelect" listener="#{PermissionLV.onRowSelect}" />
     	    		
       	<p:column headerText="#{um['i18n.table.column.role']}">
           	<h:outputText value="#{vo.roleName}"/>
       	</p:column>
       
       	<p:column headerText="#{um['i18n.resource.name']}">
           	<h:outputText value="#{vo.resourceName}"/>
       	</p:column>
 
       	<p:column headerText="#{um['i18n.permission.access.type']}">
           	<h:outputText value="#{vo.accessType}"/>
       	</p:column>
 
   	</p:dataTable>
		
</h:form>
</h:panelGroup>
