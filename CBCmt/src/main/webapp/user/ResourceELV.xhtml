<!--
In this demonstration,  and  are
used to build an application menubar. The menuItem selection events
are shown but could easily be made to invoke application logic.
-->

<h:panelGroup xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" 
	xmlns:ann="http://www.icesoft.com/icefaces/component/annotated">

<h:form id="saveFormId">
	
<p:messages id="failure" showDetail="false" autoUpdate="true" closable="true" />

<p:confirmDialog global="true" showEffect="fade" hideEffect="explode">
   	<p:commandButton value="#{um['i18n.accept.label']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
   	<p:commandButton value="#{um['i18n.deny.label']}"   type="button" styleClass="ui-confirmdialog-no"  icon="ui-icon-close" />
</p:confirmDialog>

<p:panel>
	<h:panelGrid columns="1" styleClass="contentAlignCenter">
	    <p:commandButton icon = "fa fa-plus" actionListener="#{ResourceELV.loadForNew}"/>
    </h:panelGrid>
               
	<p:dataTable id="dataTableId" 
			var="vo" 
			value="#{ResourceELV.voList}"
          	rows="30"
          	paginator="true"
           	rowsPerPageTemplate="30,50,100"
	   		selectionMode="single"
          	rowKey="#{vo.id}">

   		<p:ajax event="rowSelect" listener="#{ResourceELV.onRowSelect}" update="dataTableId"/>

        <f:facet name="header">
        	#{um['i18n.resource.header']}
        </f:facet>
 
		<p:column headerText="#{um['i18n.table.column.name']}">
			<h:outputText rendered="#{not vo.selected}" 	value="#{vo.name}" />
			<p:inputText  rendered="#{vo.selected}" 		value="#{vo.name}" style="width: 50mm; text-align: center;"/>
		</p:column>
	     
		<p:column headerText="#{um['i18n.user.description']}">
			<h:outputText rendered="#{not vo.selected}" 	value="#{vo.description}" />
			<p:inputText  rendered="#{vo.selected}" 		value="#{vo.description}" style="width: 100mm; text-align: center;"/>
		</p:column>
	     
		<p:column rendered="#{ResourceELV.buttonColspan}" headerText="#{um['i18n.button.cancelshortcut.label']}">
        	<p:commandButton rendered="#{vo.selected}"
        		icon="fa fa-undo" 
        		actionListener="#{ResourceELV.rollback}"
        		title="#{um['i18n.button.cancel.label']}"
        		update="dataTableId"/>
		</p:column>
		
		<p:column rendered="#{ResourceELV.buttonColspan}" headerText="#{um['i18n.button.saveshortcut.label']}">
        	<p:commandButton rendered="#{vo.selected}"
        		icon="saveIconClassName" 
        		actionListener="#{ResourceELV.save}"
        		title="#{um['i18n.button.save.label']}"
        		update="dataTableId"/>
		</p:column>
		
		<p:column rendered="#{ResourceELV.buttonColspan}" headerText="#{um['i18n.button.removeshortcut.label']}">
			<p:commandButton rendered="#{vo.selected}" 
               		actionListener="#{ResourceELV.delete}"
               		icon="fa fa-remove"
               		title="#{um['i18n.button.delete.label']}"
               		update="dataTableId">
           		
           		<p:confirm header="#{um['i18n.confirm.title']}" message="#{um['i18n.delete.confirm.message']}" icon="ui-icon-alert" />
           	</p:commandButton>
		</p:column>
	</p:dataTable>
</p:panel>
</h:form>
</h:panelGroup>
