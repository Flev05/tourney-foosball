<h:panelGroup xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">

<p:panel>
	<h:form>
        <h:panelGrid columns="2">
	        <p:commandButton icon = "fa fa-arrow-left"
				title="#{um['i18n.button.back.tooltip']}"
	         	actionListener="#{UserDV.backPage}"/>
	         <h:outputText value="#{um['i18n.user.dv.synopsis']}"/>
         </h:panelGrid>
   	</h:form>
</p:panel>
	
<h:form id="saveFormId">
	<p:messages id="failure" showDetail="false" autoUpdate="true" closable="true" />
   
	<p:confirmDialog global="true" showEffect="fade" hideEffect="explode">
       	<p:commandButton value="#{um['i18n.accept.label']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
       	<p:commandButton value="#{um['i18n.deny.label']}"   type="button" styleClass="ui-confirmdialog-no"  icon="ui-icon-close" />
	</p:confirmDialog>

	<p:panel>
        <h:panelGrid columns="3"  styleClass="contentAlignCenter">
            <h:outputLabel for="firstnameId" value="#{um['i18n.person.firstname.column']}* "/>
            <p:inputText id="firstnameId"
                           value="#{UserDV.vo.firstname}"
                           required="#{not empty param['saveFormId:saveButtonId']}"
                           requiredMessage="#{um['i18n.person.firstname.message']}">
            </p:inputText>
            <p:message for="firstnameId"/>
            
            <h:outputLabel for="lastnameId" value="#{um['i18n.person.lastname.column']}* "/>
            <p:inputText id="lastnameId"
                           value="#{UserDV.vo.lastname}"
                           required="#{not empty param['saveFormId:saveButtonId']}"
                           requiredMessage="#{um['i18n.person.lastname.message']}">
            </p:inputText>
            <p:message for="lastnameId"/>

            <h:outputLabel for="roleAdminId" value="#{um['i18n.role.admin.label']} "/>
			<p:selectBooleanCheckbox id="roleAdminId" value="#{UserDV.vo.roleAdmin}"/>
            <p:message for="roleAdminId"/>
       	            
            <h:outputLabel for="userDvUsernameId" value="#{um['i18n.username.label']}* "/>
            <p:inputText id="userDvUsernameId"
                           value="#{UserDV.vo.username}"
                           required="false"
                           requiredMessage="#{um['i18n.user.name.message']}">
            </p:inputText>
            <p:message for="userDvUsernameId"/>
       	            
            <h:outputLabel rendered="#{UserDV.newUser}" for="userDvPasswordId" value="#{um['i18n.password.label']}* "/>	
            <p:password rendered="#{UserDV.newUser}" 
            			id="userDvPasswordId"
                        value="#{UserDV.vo.password}">
            </p:password>            
            <p:message for="userDvPasswordId" rendered="#{UserDV.newUser}"/>

            <h:outputLabel for="confirmPasswordId" rendered="#{UserDV.newUser}" value="#{um['i18n.confirmpassword.label']}* "/>
            <p:password id="confirmPasswordId"
            			rendered="#{UserDV.newUser}"
		             	value="#{UserDV.vo.confirmPassword}">
            </p:password>
            <p:message rendered="#{UserDV.newUser}" for="confirmPasswordId"/>
        </h:panelGrid>

        <h:panelGrid columns="2" styleClass="contentAlignCenter">
            <h:outputLabel for="userDescriptionId" value="#{um['i18n.user.description']}: "/>
            <p:inputTextarea id="userDescriptionId"
                               value="#{UserDV.vo.gecos}"
                               cols="60" 
                               rows="3">
            </p:inputTextarea>
        </h:panelGrid>
	</p:panel>

	<p:panel>
        <h:panelGrid id="role-grid-id" 
        	columns="3" styleClass="contentAlignCenter">
	            
           	<h:outputLabel for="userRoleCheckBoxId" value="#{um['i18n.user.role.label']}:"/>
            <h:outputText id="userRoleAsteriskId" value="*" styleClass="asteriskStyle"/>

            <h:panelGroup id="userRoleCheckBoxId" styleClass="selectionRadioGroup" columnClasses="tableCol">
        		<p:dataTable id="role-table-id" 
        			value="#{UserDV.roleVoList}" 
        			var="role"
        			selection="#{UserDV.selectedRoles}" 
        			rowKey="#{role.id}">
        		
        			<p:column disabledSelection="#{not role.enabled}" selectionMode="multiple" style="width:16px;text-align:center"/>
		 			
			        <p:column rendered="#{UserPermissionMB.developer}" headerText="#{um['i18n.company.label']}">
			            <h:outputText value="#{role.companyName}"/>
			        </p:column>			 			

			        <p:column headerText="#{um['i18n.table.column.role']}">
			            <h:outputText value="#{role.name}"/>
			        </p:column>			 			

			        <p:column headerText="#{um['i18n.role.roletype.name']}">
			            <h:outputText value="#{um[role.roleType.name]}"/>
			        </p:column>			 			

			        <p:column headerText="#{um['i18n.user.description']}">
			            <h:outputText value="#{role.description}"/>
			        </p:column>
			        			 			
		 		</p:dataTable>			   
            </h:panelGroup>
            
        </h:panelGrid>

        <h:outputLabel rendered="#{UserPermissionMB.developer}" for="editorId" value="La guida dell'utente"/>
		<p:editor rendered="#{UserPermissionMB.developer}" id="editorId" widgetVar="editorWidget" value="#{UserDV.vo.guide}" disabled="false" />
	</p:panel>

	<p:panel>
        <h:panelGrid columns="5" styleClass="contentAlignCenter">

			<p:commandButton id="saveButtonId"
					icon="fa fa-save"
					title="#{um['i18n.button.save.tooltip']}"
				   	actionListener="#{UserDV.save}">
			</p:commandButton>

			<p:commandButton id="deleteButtonId"
					rendered="#{not UserDV.newUser}"
					icon="fa fa-remove"
					title="#{um['i18n.button.remove.tooltip']}"
					actionListener="#{UserDV.delete}">
			   	<p:confirm header="#{um['i18n.confirm.title']}" message="#{um['i18n.delete.confirm.message']}" icon="ui-icon-alert" />
			</p:commandButton>
				
		</h:panelGrid >
	</p:panel>
</h:form>
</h:panelGroup>
