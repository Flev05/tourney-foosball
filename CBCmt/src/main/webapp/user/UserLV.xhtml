<h:panelGroup xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

<ui:composition template="/layout/template.xhtml">

<ui:define name="body">

	<h:form id="dataTableFormId">
		<p:panelGrid columns="1" styleClass="contentAlignCenter">
			<p:commandButton icon = "fa fa-plus"
					title="#{um['i18n.user.navigator.new.tooltip']}"
			        actionListener="#{UserLV.loadForNew}"/>
		</p:panelGrid>
	
		<p:dataTable id="userDataTableId"
			var="vo" 
			value="#{UserLV.voList}"
	        selectionMode="single"     
	        rowKey="#{vo.id}">
	
	       <f:facet name="header">
	       		#{um['i18n.user.lv.synopsis']}
	       </f:facet>
		
			<p:ajax event="rowSelect" listener="#{UserLV.onRowSelect}" />
	     	    		
	       <p:column headerText="#{um['i18n.person.firstname.column']}">
	           	<h:outputText id="firstname"  value="#{vo.firstname}"/>
	       </p:column>
	       
	       <p:column headerText="#{um['i18n.person.lastname.column']}">
	           	<h:outputText id="lastname"  value="#{vo.lastname}"/>
	       </p:column>
	
	       <p:column headerText="#{um['i18n.table.column.username']}">
	        	<h:outputText id="username" value="#{vo.username}"/>
	       </p:column>
	   </p:dataTable>
			
	</h:form>
</ui:define>

</ui:composition>

</h:panelGroup>
