<h:panelGroup xmlns="http://www.w3.org/1999/xhtml"
          	xmlns:h="http://java.sun.com/jsf/html"
          	xmlns:f="http://java.sun.com/jsf/core"
      		xmlns:p="http://primefaces.org/ui"
          	xmlns:ui="http://java.sun.com/jsf/facelets">
          			
<h:panelGrid columns="1">
    <p:commandLink rendered="#{UserPermissionMB.rendered('accordion.user.roletype')}" value="#{um['i18n.role.roletype.name']}" actionListener="#{RoleTypeELV.load}"/>

    <p:commandLink rendered="#{UserPermissionMB.rendered('accordion.user.full.role')}" value="#{um['i18n.user.full.role.label']}" actionListener="#{FullRoleLV.load}"/>

    <p:commandLink rendered="#{UserPermissionMB.rendered('accordion.user.resource')}" value="#{um['i18n.resource.label']}" actionListener="#{ResourceELV.load}"/>

    <p:commandLink rendered="#{UserPermissionMB.rendered('accordion.user.permission')}" value="#{um['i18n.permission.label']}" actionListener="#{PermissionLV.load}"/>

    <p:commandLink value="#{um['i18n.user.navigator.lv.label']}" actionListener="#{UserLV.load}"/>

    <p:commandLink value="#{um['i18n.user.resetpassword.label']}" actionListener="#{ResetPasswordLV.load}"/>
</h:panelGrid>
</h:panelGroup>
