<h:panelGroup styleClass="erpComponentBox"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
				xmlns:p="http://primefaces.org/ui">

<p:panel styleClass="textAlignCenter">
    <h:outputText  value="#{um['i18n.user.resetpassword.synopsis']}"/>
</p:panel>

   <h:form id="saveFormId">
   	<p:messages id="failure" showDetail="false" autoUpdate="true" closable="true" />
   
      	<p:confirmDialog global="true" showEffect="fade" hideEffect="explode">
       	<p:commandButton value="#{um['i18n.accept.label']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
       	<p:commandButton value="#{um['i18n.deny.label']}"   type="button" styleClass="ui-confirmdialog-no"  icon="ui-icon-close" />
	</p:confirmDialog>
   
	<p:panel id="changePasswprdId">
        <h:panelGrid columns="3" styleClass="contentAlignCenter">
       		<h:outputLabel for="usernameForChangePwdId" value="#{um['i18n.username.label']} "/>
            <h:outputText id="usernameForChangePwdId" 
	            value="#{ResetPasswordDV.vo.username}"
	            styleClass="usernameBlackStyle" 
	            style="color:red;"/>
           	<p:message for="usernameForChangePwdId"/>
        </h:panelGrid>
	</p:panel>

	<script type="text/javascript">document.getElementById('saveFormId:saveButtonId').focus();</script> 

	<p:panel>
        <h:panelGrid columns="5" styleClass="contentAlignCenter">
	        <p:commandButton id="backButtonId"
	         	actionListener="#{ResetPasswordDV.backPage}"
	         	icon = "fa fa-arrow-left"
				title="#{um['i18n.button.back.tooltip']}" />
	
			<p:commandButton id="saveButtonId"
					title="#{um['i18n.button.save.tooltip']}"
					value="#{um['i18n.button.reset.label']}"
				   	actionListener="#{ResetPasswordDV.save}"
				   	update="changePasswprdId"/>
		</h:panelGrid >
	</p:panel>
	
</h:form>	
</h:panelGroup>
