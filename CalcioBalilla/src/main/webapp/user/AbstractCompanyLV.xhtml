<!--
In this demonstration,  and  are
used to build an application menubar. The menuItem selection events
are shown but could easily be made to invoke application logic.
-->

<h:panelGroup xmlns="http://www.w3.org/1999/xhtml"
		xmlns:h="http://java.sun.com/jsf/html" 
		xmlns:f="http://java.sun.com/jsf/core" 
		xmlns:p="http://primefaces.org/ui" >

<h:form rendered="#{UserPermissionMB.rendered('accordion.console')}">
	<h:panelGrid columns="1" styleClass="contentAlignCenter">
	    <p:commandButton icon = "fa fa-plus" value="#{um['i18n.company.new']}" actionListener="#{MB.loadForNew}" />
    </h:panelGrid>
</h:form>

<h:form id="dataTableFormId">
	               
	<p:dataTable id="companyDataTableId" 
			var="vo" 
			value="#{MB.voList}"
            selectionMode="single"
            rowKey="#{vo.id}"
            style="margin-bottom:20px">		               

        <f:facet name="header">
          	#{um['i18n.company.lv.synopsis']}
        </f:facet>

		<p:ajax event="rowSelect"   listener="#{MB.onRowSelect}" />
       
        <p:column headerText="#{um['i18n.company.name']}">
           	<h:outputText value="#{vo.name}" />
       	</p:column>

        <p:column>
           	<f:facet name="header">
               	<h:outputText value="#{um['i18n.company.email']}" />
           	</f:facet>
           	<h:outputText value="#{vo.companyEmail}" />
       	</p:column>
                     	
        <p:column>
           	<f:facet name="header">
               	<h:outputText value="#{um['i18n.company.phonenumber']}" />
           	</f:facet>
           	<h:outputText value="#{vo.phoneNumber}" />
       	</p:column>
                     	
       </p:dataTable>
</h:form>
	
</h:panelGroup>
