<h:panelGroup xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">

<p:panel>
	<h:form>
        <p:commandButton icon = "fa fa-arrow-left"
			title="#{um['i18n.button.back.tooltip']}"
         	actionListener="#{MB.backPage}"/>
       	<h:outputText value="#{um['i18n.role.header.dv']}"/>
   	</h:form>
</p:panel>
	
<h:form id="saveFormId">
	<p:messages id="failure" showDetail="false" autoUpdate="true" closable="true" />

	<p:confirmDialog global="true" showEffect="fade" hideEffect="explode">
       	<p:commandButton value="#{um['i18n.accept.label']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
       	<p:commandButton value="#{um['i18n.deny.label']}"   type="button" styleClass="ui-confirmdialog-no"  icon="ui-icon-close" />
	</p:confirmDialog>

	<p:panel>

        <h:panelGrid columns="3" styleClass="contentAlignCenter">
		
	        <h:outputLabel for="companyId" value="#{um['i18n.role.company.name']}: "/>
	        <p:selectOneMenu id="companyId" value="#{MB.vo.companyId}">
	            <f:selectItems value="#{MB.companyList}" 
	                    var="lpo" 
	                    itemValue="#{lpo.id}" 
	                    itemLabel="#{lpo.name}" />
	      	</p:selectOneMenu>
   			<p:message for="companyId"/>

	        <h:outputLabel for="roleTypeId" value="#{um['i18n.role.name']}: "/>
	        <p:selectOneMenu id="roleTypeId" value="#{MB.vo.roleId}">
	            <f:selectItems value="#{MB.roleTypeList}" 
	                    var="lpo" 
	                    itemValue="#{lpo.id}" 
	                    itemLabel="#{lpo.name}" />
	      	</p:selectOneMenu>
   			<p:message for="roleTypeId"/>
		
		    <h:outputLabel for="rolenameId" value="#{um['i18n.role.new.name']}: "/>
            <p:inputText id="rolenameId"
                           value="#{MB.vo.name}"
                           required="#{not empty param['saveFormId:saveButtonId']}"
                           requiredMessage="#{um['i18n.role.name.message']}">
            </p:inputText>
            <p:message  for="rolenameId"/>
		
            <h:outputLabel for="roleDescriptionId" value="#{um['i18n.user.description']}: "/>
            <p:inputTextarea id="roleDescriptionId"
                               value="#{MB.vo.description}"
                               cols="60" 
                               rows="3">
            </p:inputTextarea>
   			
      	</h:panelGrid> 
   	</p:panel>

	<p:panel>
        <h:panelGrid columns="5" styleClass="contentAlignCenter">

			<p:commandButton icon = "fa fa-save"
					title="#{um['i18n.button.save.tooltip']}"
				   	actionListener="#{MB.save}"
				   	update="saveFormId">
			</p:commandButton>

			<p:commandButton icon = "fa fa-remove"
					rendered="#{not MB.newRole}"
					title="#{um['i18n.button.remove.tooltip']}"
					actionListener="#{MB.delete}"
					update="saveFormId">
			   	<p:confirm header="#{um['i18n.confirm.title']}" message="#{um['i18n.delete.confirm.message']}" icon="ui-icon-alert" />
			</p:commandButton>
				
		</h:panelGrid >
	</p:panel>
</h:form>
</h:panelGroup>
