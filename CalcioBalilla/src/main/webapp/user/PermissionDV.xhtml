<h:panelGroup xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">
	
<ui:composition template="/main/template.xhtml">
<ui:define name="page-content">
	
<p:panel>
	<h:form>
        <h:panelGrid columns="2">
	        <p:commandButton icon = "fa fa-arrow-left"
				title="#{um['i18n.button.back.tooltip']}"
	         	actionListener="#{PermissionDV.backPage}"/>
         </h:panelGrid>
   	</h:form>
</p:panel>
	
<h:form id="saveFormId">
	<p:messages id="failure" showDetail="false" autoUpdate="true" closable="true" />
   
	<p:confirmDialog global="true" showEffect="fade" hideEffect="explode">
       	<p:commandButton value="#{um['i18n.accept.label']}" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
       	<p:commandButton value="#{um['i18n.deny.label']}"   type="button" styleClass="ui-confirmdialog-no"  icon="ui-icon-close" />
	</p:confirmDialog>

	<p:panel header="#{um['i18n.permission.header.dv']}">

		<h:panelGrid columns="2">
	        <h:outputLabel for="roleId" value="#{um['i18n.table.column.role']}: "/>
	        <p:selectOneMenu id="roleId" value="#{PermissionDV.vo.roleTypeId}">
	            <f:selectItems value="#{PermissionDV.roleTypeList}" 
	                    var="si" 
	                    itemValue="#{si.id}" 
	                    itemLabel="#{si.name}" />
	      	</p:selectOneMenu>
		
	        <h:outputLabel for="companyId" value="#{um['i18n.resource.name']}: "/>
	        <p:selectOneMenu id="companyId" value="#{PermissionDV.vo.resourceId}">
	            <f:selectItems value="#{PermissionDV.resourceList}" 
	                    var="si" 
	                    itemValue="#{si.id}" 
	                    itemLabel="#{si.name}" />
	      	</p:selectOneMenu> 
		
	        <h:outputLabel for="permissionId" value="#{um['i18n.permission.access.type']}: "/>
	        <p:selectOneMenu id="permissionId" value="#{PermissionDV.vo.permissionId}">
	            <f:selectItems value="#{PermissionDV.permissionList}" 
	                    var="si" 
	                    itemValue="#{si.id}" 
	                    itemLabel="#{si.name}" />
	      	</p:selectOneMenu> 
      	</h:panelGrid>
   	</p:panel>

	<p:panel>
        <h:panelGrid columns="5" styleClass="contentAlignCenter">

			<p:commandButton  icon = "fa fa-save"
					title="#{um['i18n.button.save.tooltip']}"
				   	actionListener="#{PermissionDV.save}">
			</p:commandButton>

			<p:commandButton icon = "fa fa-remove"
					rendered="#{not PermissionDV.newPermission}"
					title="#{um['i18n.button.remove.tooltip']}"
					actionListener="#{PermissionDV.delete}">
			   	<p:confirm header="#{um['i18n.confirm.title']}" message="#{um['i18n.delete.confirm.message']}" icon="ui-icon-alert" />
			</p:commandButton>
				
		</h:panelGrid >
	</p:panel>
</h:form>
</ui:define>
</ui:composition>	
</h:panelGroup>
