<p *ngIf="authService.isLoggedIn">
     <button (click)="logout()" >Logout</button>
     <button (click)="logout()" >Change Password</button>
</p>

<div class="container" *ngIf="!authService.isLoggedIn">
    <h1>Login Form</h1>
    <form #loginForm="ngForm" (ngSubmit)="login()">

        <div class="form-group">
            <label for="usernameId">Username</label>
            <input type="text" class="form-control" id="usernameId" required
                [(ngModel)]="loginData.username" name="username"
                #nametrv="ngModel">
        </div>
        <div [hidden]="nametrv.valid || nametrv.pristine"
            class="alert alert-danger">
            La username è obbligatoria
        </div>
      
        <div class="form-group">
            <label for="passwordId">Nome</label>
            <input type="password" class="form-control" id="passwordId" required
                [(ngModel)]="loginData.password" name="password"
                #passwrodtrv="ngModel">
        </div>
        <div [hidden]="passwrodtrv.valid || passwrodtrv.pristine"
            class="alert alert-danger">
            La password è obbligatoria
        </div>

        <button type="submit" class="btn btn-success" [disabled]="!loginForm.form.valid">Login</button>
    </form>
</div>
