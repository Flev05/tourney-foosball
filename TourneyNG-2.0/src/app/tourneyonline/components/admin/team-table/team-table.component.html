<p-table #table [responsive]="true" 
        [columns]="cols" 
        [value]="teams" 
        selectionMode="single"
        [(selection)]="selectedTeam" 
        (onRowSelect)="onRowSelect($event)" 
        [scrollable]="true" 
        scrollHeight="250px">

    <ng-template *ngIf="addTeamEnabled" pTemplate="caption">
        <div style="text-align:left">
            <button pButton icon="pi pi-plus" type="button" (click)="create()" label="Aggiungi Squadra" ></button>
        </div>
    </ng-template>

    <ng-template pTemplate="header" let-columns>
        <tr>
            <th style="width: 15mm;">{{ table.filteredValue ? table.filteredValue.length : teams.length }}</th>
            <th>Nome</th>
            <th>Indirizzo</th>
            <th>ASD</th>
            <th *ngIf="addTeamEnabled" style="width: 15mm;"></th>
        </tr>
        <tr>
            <th style="width: 15mm;">N°</th>
            <th>
                <input 
                    style="width: 100%;" 
                    type="text" 
                    pInputText 
                    placeholder="Cerca per nome" 
                    (input)="table.filter($any($event.target).value.trim(), 'teamName', 'contains')">
            </th>
            <th></th>
            <th>
                <input 
                    style="width: 100%;" 
                    type="text" 
                    pInputText 
                    placeholder="Cerca per ASD" 
                    (input)="table.filter($any($event.target).value.trim(), 'asd', 'contains')">
            </th>
            <th *ngIf="addTeamEnabled" style="width: 15mm;">X</th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-rowData let-columns="columns" let-rowIndex="rowIndex">
        <tr [pSelectableRow]="rowData">
            <td style="width: 15mm; text-align: center;">{{rowIndex+1}}</td>
            <td style="text-align: center;">{{rowData['teamName']}}</td>
            <td style="text-align: center;">{{rowData['address']}} - {{rowData.country?.zipCode}} - {{ rowData.country?.city }} ({{ rowData.country?.provinceCode }})</td>
            <td style="text-align: center;">{{rowData['asd']}}</td>            
            <td *ngIf="addTeamEnabled" style="width: 15mm; text-align: center;">
                <button class="ui-button-danger" pButton icon="pi pi-remove" (click)="doDelete(rowData)"></button>
            </td>                
        </tr>
    </ng-template>

    <ng-template *ngIf="addTeamEnabled" pTemplate="summary">
        <div style="text-align:left">
            <button pButton icon="pi pi-plus" type="button" (click)="create()" label="Aggiungi Squadra" ></button>
        </div>
    </ng-template>
</p-table>
