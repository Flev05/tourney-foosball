<div class="layout-wrapper">
    <div id="layout-topbar">
        <a href="#" class="menu-button" (click)="onMenuButtonClick($event)">
            <i class="fa fa-bars"></i>
        </a>

        <a href="#" class="logo" [routerLink]="['/']">
            <img alt="logo" src="assets/showcase/images/omino.jpg" />
            <img alt="logo" src="assets/showcase/images/volley.jpg" />
            <img alt="logo" src="assets/showcase/images/basket.jpg" />
            <img alt="logo" src="assets/showcase/images/logoTorneiNG.png" />
        </a>

        <ul class="topbar-menu">
            <li>
                <a href="#" [routerLink]="['/']">Home</a>
            </li>
            <li>
                <a href="#" [routerLink]="['/']">Chi siamo</a>
            </li>
        </ul>
    </div>

    <div id="layout-sidebar" [ngClass]="{'active': menuActive}">
        <div class="layout-menu">
            <a id="menu_home" #homemenutitle [class.active-menuitem]="homemenutitle.id == activeMenuId" (click)="activeMenuId = (activeMenuId === homemenutitle.id ? null : homemenutitle.id)">
                <img src="assets/showcase/images/icons/menu-active.svg" class="layout-menu-icon-active"/>
                <img src="assets/showcase/images/icons/menu.svg" class="layout-menu-icon-inactive"/>
                <span>HOME</span>
            </a>
            <div [ngClass]="{submenushow: (homemenutitle.id == activeMenuId), 'submenuhide': (homemenutitle.id != activeMenuId)}">                
                <a [routerLink]="['/demo']" (click)="menuActive = false">&#9679; Demo</a>
                <a [routerLink]="['/owner']" (click)="menuActive = false">&#9679; Proprietaria</a>
                <a [routerLink]="['/realtime']" (click)="menuActive = false">&#9679; Tempo Reale</a>
            </div>
          
            <a id="menu_input" #inputmenutitle [class.active-menuitem]="inputmenutitle.id == activeMenuId" (click)="activeMenuId = (activeMenuId === inputmenutitle.id ? null : inputmenutitle.id)">
                <img src="assets/showcase/images/icons/input-active.svg" class="layout-menu-icon-active"/>
                <img src="assets/showcase/images/icons/input.svg" class="layout-menu-icon-inactive"/>
                <span>Admin</span>
            </a>
            <div [ngClass]="{submenushow: (inputmenutitle.id == activeMenuId), 'submenuhide': (inputmenutitle.id != activeMenuId)}">
                <a [routerLink]="['/companies']" (click)="menuActive = false">&#9679; Clienti</a>
                <a [routerLink]="['/userng']" (click)="menuActive = false">&#9679; Utenti</a>
                <a [routerLink]="['/password']" (click)="menuActive = false">&#9679; Reset Password</a>
            </div>

            <a id="data_menutitle" #datamenutitle [class.active-menuitem]="datamenutitle.id == activeMenuId" (click)="activeMenuId = (activeMenuId === datamenutitle.id ? null : datamenutitle.id)">
                <img src="assets/showcase/images/icons/button-active.svg" class="layout-menu-icon-active"/>
                <img src="assets/showcase/images/icons/button.svg" class="layout-menu-icon-inactive"/>
                <span>Tornei</span>
            </a>
            <div [ngClass]="{'submenushow': (datamenutitle.id == activeMenuId), 'submenuhide': (datamenutitle.id != activeMenuId)}">
                <a [routerLink]="['/tornei']" (click)="menuActive = false">&#9679; Tornei</a>
                <a [routerLink]="['/calendario']" (click)="menuActive = false">&#9679; Calendario</a>
                <a [routerLink]="['/risultati']" (click)="menuActive = false">&#9679; Risultati</a>
                <a [routerLink]="['/classifica']" (click)="menuActive = false">&#9679; Classifica</a>
            </div>
        </div>
    </div>

    <div class="layout-mask" *ngIf="menuActive">
    </div>

    <div id="layout-content">
        <div>
            <router-outlet></router-outlet>
        </div>
        <div class="content-section layout-footer clearfix">
            <span>TorneiNG 1.0.0</span>
            <div class="footer-links">
                <a href="https://www.facebook.com/CalcioBalillaPregnana/"><i class="fa fa-facebook"></i></a>
            </div>
        </div>
    </div>
</div>
