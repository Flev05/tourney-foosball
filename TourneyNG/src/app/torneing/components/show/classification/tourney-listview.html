<div class="content-section introduction">
    <div>
        <span class="feature-title">Classifica</span>
        <span>Vista elenco</span>
    </div>
</div>

<div class="content-section documentation">
    <p>Vista elenco dei tornei dalla quale si accede alla corrispondente classifica per gironi.
        Una volta selezionato il torneo, si accede alla corrispondente vista di dettaglio 
        dei gironi del torneo.
    </p>
</div>

<p-table [columns]="cols" [value]="tourneys" 
    selectionMode="single" 
    [(selection)]="selectedTourney" 
    (onRowSelect)="onRowSelect($event)" 
    [paginator]="true" 
    [rows]="15">

    <ng-template pTemplate="colgroup" let-columns>
        <colgroup>
            <col style="width: auto;">
            <col style="width: 30mm;">
            <col style="width: 20mm;">
            <col style="width: auto;">
        </colgroup>
    </ng-template>

    <ng-template pTemplate="header" let-columns>
        <tr>
            <th *ngFor="let col of columns">
                {{col.header}}
            </th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-rowData let-columns="columns">
        <tr [pSelectableRow]="rowData">
            <td *ngFor="let col of columns">
                {{rowData[col.field]}}
            </td>
        </tr>
    </ng-template>
</p-table>
