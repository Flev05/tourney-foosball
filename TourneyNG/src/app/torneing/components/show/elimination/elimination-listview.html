<div class="content-section introduction">
    <div>
        <span class="feature-title">Eliminazione diretta</span>
        <span>Fase ad eliminazione diretta</span>
    </div>
</div>

<div class="content-section documentation">

    <p>Vista elenco dei tornei che prevedono la fase ad eliminazione diretta.
    </p>
</div>

<div class="content-section implementation">   
    
    <p-organizationChart [value]="data"
        styleClass="company">
        <ng-template let-node pTemplate="leaf">
            <span style="font-weight:bold">{{node.label}}</span>
        </ng-template>
        <ng-template let-node pTemplate="default">
            {{node.label}}
        </ng-template>
    </p-organizationChart>
