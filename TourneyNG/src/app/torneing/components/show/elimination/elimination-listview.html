<div class="content-section introduction">
    <div>
        <span class="feature-title">Eliminazione diretta</span>
        <span>Fase ad eliminazione diretta {{selectedTourney.tourneyName}}</span>
    </div>
</div>

<div class="content-section documentation">

    <p>Vista dei tornei che prevedono la fase ad eliminazione diretta.
    </p>
</div>

<div class="content-section implementation">    
    <div style="overflow: auto;">
        <p-organizationChart [value]="data1" styleClass="company">
            <ng-template let-node pTemplate="leaf">
                <p><span style="font-weight:bold">{{node.data.date}}</span></p>
                <p><span style="font-weight:bold">{{node.data.location}}</span></p>
                <p><span style="font-weight:bold">{{node.label}}</span></p>
            </ng-template>
            <ng-template let-node pTemplate="default">
                <p>{{node.data.date}}</p>
                <p>{{node.data.location}}</p>
                <p>{{node.label}}</p>
            </ng-template>
        </p-organizationChart>    
    </div>
</div>
