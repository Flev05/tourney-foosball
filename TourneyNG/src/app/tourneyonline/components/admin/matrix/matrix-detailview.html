<div class="content-section introduction">
    <div>
        <span class="feature-title">Matrice dei punti</span>
        <span>Vista di dettaglio della matrice dei punti {{roundName}}</span>
    </div>
</div>

<div class="content-section documentation">
    <p>
        Da questa vista potete modificare i dati della matrice dei punti per il girone selezionato 
        Impostare correttamente i dati nelle due caselle cui si ricerisce l'incontro e salvare
    </p>
</div>

<div class="content-section implementation">
    <p-growl [value]="msgs" sticky="sticky"></p-growl>    

    <p-table [columns]="cols" [value]="rows" 
        selectionMode="single" 
        [(selection)]="selectedTeam" 
        (onRowSelect)="onRowSelect($event)" >

    <ng-template pTemplate="caption" let-rowData>
        <div class="ui-dialog-buttonpane ui-helper-clearfix">
            <button type="button" icon="fa-arrow-left" pButton (click)="goBack()" label="Indietro"></button>
        </div>                  
    </ng-template>        

    <ng-template pTemplate="header" let-columns>
        <tr>
            <th *ngFor="let col of columns">
                {{col.header}}
            </th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-rowData let-columns="columns">
        <tr [pSelectableRow]="rowData">
            <td *ngFor="let col of columns" pEditableColumn>
                <p-cellEditor>
                    <ng-template pTemplate="input">
                        <input type="text" [(ngModel)]="rowData[col.field]">
                    </ng-template>
                    <ng-template pTemplate="output">
                        {{rowData[col.field]}}
                    </ng-template>
                </p-cellEditor>
            </td>            
        </tr>
    </ng-template>

    <ng-template pTemplate="summary" let-rowData>
        <div style="text-align:left">
            <button pButton icon="fa-save" type="button" (click)="save()" label="Salva" ></button>
        </div>
    </ng-template>        
</p-table> 

</div>
