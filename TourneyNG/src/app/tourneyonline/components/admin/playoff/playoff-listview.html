<div class="content-section introduction">
    <div>
        <span class="feature-title">Playoff</span>
        <span>Playoff del torneo: {{selectedTourney.tourneyName}}</span>
    </div>
</div>

<div class="content-section documentation">

    <p>Vista elenco di tutti i gironi che compongono il torneo: 
        {{selectedTourney.tourneyName}} - {{selectedTourney.dateAsString}} {{selectedTourney.timeAsString}}
    </p>
</div>

<div class="content-section implementation">    
    <p-table [responsive]="true" 
        [value]="playoffs"
        selectionMode="single"
        [(selection)]="selectedPlayoff" 
        (onRowSelect)="onRowSelect($event)" 
        [paginator]="true" 
        [rows]="15">

        <ng-template pTemplate="caption">
            <button type="button" icon="fa-arrow-left" pButton (click)="goBack()"></button>
            <div style="text-align:left">
                <button pButton icon="fa-plus" type="button" (click)="create()" label="Nuovo Playoff" ></button>
            </div>
        </ng-template>
 
        <ng-template pTemplate="colgroup">
            <colgroup>
                <col style="width: auto;">
            </colgroup>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th>Classificata</th>
                <th>Girone</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-rowData let-rowIndex="rowIndex">
            <tr  [pSelectableRow]="rowData">
                <td>
                    <p-dropdown [options]="positions" [(ngModel)]="rowData.position"></p-dropdown>
                </td>
                <td>
                    <p-dropdown [options]="rounds" [(ngModel)]="rowData.roundName"></p-dropdown>
                </td>
            </tr>
        </ng-template>
    
        <ng-template pTemplate="summary" let-rowData>
            <div style="text-align:left">
                <button pButton icon="fa-plus" type="button" (click)="create()" label="Nuovo Playoff" ></button>
            </div>
        </ng-template>        
        
    </p-table>

</div>
