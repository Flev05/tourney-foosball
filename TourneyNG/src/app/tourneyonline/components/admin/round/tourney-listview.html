<div class="content-section introduction">
    <div>
        <span class="feature-title">Gironi</span>
        <span>Vista elenco dei tornei dai quali si accede ai gironi</span>
    </div>
</div>

<div class="content-section documentation">
<p-accordion>
    <p-accordionTab header="Istruzioni">                          
    <p> 
        Selezionare il torneo per accedere alla corrispondente vista elenco dei gironi che lo compongono. 
    </p>
    </p-accordionTab>
</p-accordion>    
</div>

<p-table [value]="tourneys" 
    selectionMode="single" 
    [(selection)]="selectedTourney" 
    (onRowSelect)="onRowSelect($event)"  >

    <ng-template pTemplate="colgroup">
        <colgroup>
            <col style="width: 10mm;">
            <col style="width: auto;">
            <col style="width: auto;">
        </colgroup>
    </ng-template>

    <ng-template pTemplate="header">
        <tr>
            <th>N°</th>
            <th>Nome</th>
            <th>Data</th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-rowData let-rowIndex="rowIndex">
        <tr [pSelectableRow]="rowData">
            <td>{{rowIndex + 1}}</td>
            <td>{{rowData.tourneyName}}</td>
            <td>{{rowData.datetime | date : "dd/MM/y HH:mm"}}</td>
        </tr>
    </ng-template>

</p-table>
