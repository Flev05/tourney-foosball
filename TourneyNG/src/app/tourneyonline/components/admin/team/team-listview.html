<div class="content-section introduction">
    <div>
        <span class="feature-title">Squadre</span>
        <span>Vista elenco squadre del torneo</span>
    </div>
</div>

<div class="content-section documentation">
<p-accordion>
    <p-accordionTab header="Istruzioni">              
        <p>
            Vista elenco di tutte le squadre che compongono il torneo
        </p>
        <p>
            Click su un punto qualsiasi della riga per accedere alla vista di dettaglio della squadra.
        </p>
    </p-accordionTab>
</p-accordion>    
</div>

<div class="content-section implementation">    
    <h3><span>Torneo: {{selectedTourney.tourneyName}}</span></h3>

    <button type="button" icon="fa-arrow-left" pButton (click)="goBack()" label="Indietro"></button>

    <p-table [responsive]="true" 
        [columns]="cols" 
        [value]="rows" 
        selectionMode="single"
        [(selection)]="selectedRow" 
        (onRowSelect)="onRowSelect($event)" >

        <ng-template pTemplate="caption">
            <div style="text-align:left">
                <button pButton icon="fa-plus" type="button" (click)="create()" label="Aggiungi Squadra" ></button>
            </div>
        </ng-template>

        <ng-template pTemplate="header" let-columns>
            <tr>
                <th *ngFor="let col of columns">
                    &#123;&#123;col.header&#125;&#125;
                </th>
            </tr>
        </ng-template>
    
        <ng-template pTemplate="body" let-rowData let-columns="columns" let-rowIndex="rowIndex">
            <tr [pSelectableRow]="rowData">
                <td *ngFor="let col of columns">
                    <span class="ui-column-title">&#123;&#123;col.header&#125;&#125;</span>
                    &#123;&#123;rowData[col.field]&#125;&#125;
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="summary">
            <div style="text-align:left">
                <button pButton icon="fa-plus" type="button" (click)="create()" label="Aggiungi Squadra" ></button>
            </div>
        </ng-template>
    </p-table>
</div>
