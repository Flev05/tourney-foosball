<div class="content-section introduction">
    <div>
        <span class="feature-title">Aggiungi Squadre</span>
        <span>Vista elenco per aggiungere le squadre al torneo</span>
    </div>
</div>

<div class="content-section documentation">
<p-accordion>
    <p-accordionTab header="Introduzione">            
        <p>
            Da questa vista potete aggiungere una o più squadre selezionandole da quelle disponibili.
            Se la squadra non esiste, la potete creare con il bottone Nuova Squadra
        </p>
    </p-accordionTab>
</p-accordion>
</div>

<h4><span>Torneo: {{selectedTourney.tourneyName}}</span></h4>

<div class="ui-dialog-buttonpane ui-helper-clearfix">
    <button type="button" icon="fa fa-arrow-left" pButton (click)="goBack()" label="Indietro"></button>
</div>                  

<div class="ui-grid ui-grid-responsive ui-grid-pad ui-fluid" style="margin: 10px 0px">

    <p-pickList [source]="avalilableTeams" [target]="targetTeams" 
            sourceHeader="Disponibili {{avalilableTeams.length}}" 
            targetHeader="Selezionati {{targetTeams.length}}" 
            [responsive]="true"
            dragdrop="true" 
            dragdropScope="teams" 
            [sourceStyle]="{'height':'400px'}" 
            [targetStyle]="{'height':'400px'}">
        <ng-template let-t pTemplate="item">
            <div class="ui-helper-clearfix">
                <div>{{t}}</div>
            </div>
        </ng-template>
    </p-pickList>     

    <div class="ui-grid ui-grid-responsive ui-grid-pad ui-fluid" style="margin: 10px 0px">
        <div class="ui-grid-row">
            <div class="ui-grid-col-3">
                <button class="ui-button-success" pButton type="button" icon="fa fa-group" label="Nuova Squadra" 
                (click)="newTeam()"></button>
            </div>
        </div>
    </div>

</div>
