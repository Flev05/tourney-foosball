<h2>Regole per il passaggio del turno ai playoff</h2>
<h3>Torneo: {{selectedTourney.tourneyName}}</h3>
<h4>Girone: {{selectedPlayoff.round.name}}</h4>
   
<div class="ui-dialog-buttonpane ui-helper-clearfix">
    <button type="button" icon="fa fa-arrow-left" pButton (click)="goBack()" label="Indietro"></button>

    <button *ngIf="atLeast2Rules" 
        type="button" 
        icon="fa fa-user-plus"  
        label="Incontri" 
        pButton (click)="goMeeting()" 
        class="ui-button-success">
    </button>
</div>                  

<p-table *ngIf="atLeast1Rule"
        [columns]="playoffCols" 
        [value]="playoffRules" 
        responsive="true">

    <ng-template pTemplate="header" let-columns>
        <tr>
            <th style="width: 15mm;">N°</th>
            <th *ngFor="let col of columns">
                {{col.header}}
            </th>
        </tr>            
    </ng-template>

    <ng-template pTemplate="body" let-rowData let-rowIndex="rowIndex">
        <tr>
            <td style="width: 15mm; text-align: center;">{{rowIndex + 1}}</td>  
            <td>
                {{rowData.fromRound.position.label}}
            </td>
            <td>
                {{rowData.fromRound.round.label}}
            </td>    
            <td>
                {{rowData.teamName}}
            </td>    
        </tr>
    </ng-template>
</p-table>
