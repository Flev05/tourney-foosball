<div class="ui-dialog-buttonpane ui-helper-clearfix">
    <div class="ui-grid-row">
        <div class="ui-grid-col-3">
            <button type="button" icon="fa fa-arrow-left" pButton (click)="goBack()"></button>
        </div>
        <div class="ui-grid-col-6">
            <span style="font-weight: bold;">{{selectedTourney.tourneyName}} - {{selectedTourney.datetime | date: 'dd/MM/y'}}</span>
        </div>
        <div class="ui-grid-col-6">
            <span style="font-weight: bold;">{{tourneyService.selectedEliminatoryLevel.name}}</span>
        </div>
    </div>
</div>    
<p-tabView [activeIndex]="tourneyService.selectedEliminatoryTabIndex" 
        (onChange)="onChangeTab($event)">

    <p-tabPanel header="Andata">
        <p-table [columns]="cols"
            [value]="onewayMeetings" 
            selectionMode="single" 
            [(selection)]="selectedRow"  
            (onRowSelect)="onEliminatoryRowSelect($event)">

            <ng-template pTemplate="header" let-columns>
                <tr>
                    <th *ngFor="let col of columns">
                        {{col.header}}
                    </th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-rowData let-columns="columns">
                <tr [pSelectableRow]="rowData">
                    <td *ngFor="let col of columns">
                        {{rowData[col.field]}}
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </p-tabPanel>

    <p-tabPanel *ngIf="isRoundTrip" header="Ritorno">
        <p-table [columns]="cols"
            [value]="roundtripMeetings" 
            selectionMode="single" 
            [(selection)]="selectedRow"  
            (onRowSelect)="onEliminatoryRowSelect($event)">
 
            <ng-template pTemplate="header" let-columns>
                <tr>
                    <th *ngFor="let col of columns">
                        {{col.header}}
                    </th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-rowData let-columns="columns">
                <tr [pSelectableRow]="rowData">
                    <td *ngFor="let col of columns">
                        {{rowData[col.field]}}
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </p-tabPanel>   

    <p-tabPanel header="Classifica">    
        <p-table [columns]="classificationCols"
            [value]="eliminatoryClassification"
            selectionMode="single" 
            [(selection)]="selectedClassificationRow"  
            (onRowSelect)="onClassifcationRowSelect($event)" >  
 
            <ng-template pTemplate="header" let-columns>
                <tr>
                    <th class="position">P°</th>
                    <th *ngFor="let col of columns" [ngClass]="col.style">
                        {{col.header}}
                    </th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-rowData let-columns="columns" let-rowIndex="rowIndex">
                <tr>
                    <td style="text-align: center;">{{rowIndex+1}}</td>
                    <td *ngFor="let col of columns" [ngClass]="col.style">
                        {{rowData[col.field]}}
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </p-tabPanel>    
</p-tabView>
