<div class="ui-dialog-buttonpane ui-helper-clearfix">
    <div class="ui-grid-row">
        <div class="ui-grid-col-3">
            <button type="button" icon="fa fa-arrow-left" pButton (click)="goBack()"></button>
        </div>
        <div class="ui-grid-col-5">
            <span style="font-weight: bold;">{{selectedTourney.tourneyName}}</span>
        </div>
        <div class="ui-grid-col-5">
            <span style="font-weight: bold;">{{selectedTourney.datetime | date: 'dd/MM/y'}}</span>
        </div>
    </div>
</div>     
<p-tabView [activeIndex]="selectedTourney.selectedResultTabIndex" (onChange)="onChangeTab($event)">
    <p-tabPanel header="Gironi({{roundCount}})" *ngIf="containsRound()" >    
        <p-table [columns]="roundCols"
            [value]="roundRows"
            selectionMode="single" 
            [(selection)]="selectedRound"
            (onRowSelect)="onRoundRowSelect($event)" >

            <ng-template pTemplate="header" let-columns>
                <tr>
                    <th *ngFor="let col of columns">
                        {{col.header}}
                    </th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-rowData let-columns="columns" let-rowIndex="rowIndex">                    
                <tr [pSelectableRow]="rowData">
                    <td *ngFor="let col of columns">
                        {{rowData[col.field]}}
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </p-tabPanel>

    <p-tabPanel header="Playoff({{playoffCount}})" *ngIf="containsPlayoff()">    
        <p-table [columns]="playoffCols"
            [value]="playoffRows"
            selectionMode="single" 
            [(selection)]="selectedPlayoff"
            (onRowSelect)="onPlayoffRowSelect($event)">

            <ng-template pTemplate="header" let-columns>
                <tr>
                    <th *ngFor="let col of columns">
                        {{col.header}}
                    </th>
                </tr>
            </ng-template>
    
            <ng-template pTemplate="body" let-rowData let-columns="columns" let-rowIndex="rowIndex">                    
                <tr [pSelectableRow]="rowData">
                    <td *ngFor="let col of columns">
                        {{rowData[col.field]}}
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </p-tabPanel>

    <p-tabPanel header="Eliminazioni Dirette({{eliminatoryCount}})" *ngIf="containsEliminatory()" >   
        <p-table [columns]="eliminatoryLevelCols"
                [value]="eliminatoryLevelRows" 
                selectionMode="single" 
                [(selection)]="selctedEliminatoryLevel" 
                (onRowSelect)="onEliminatoryRowSelect($event)">

            <ng-template pTemplate="header" let-columns>
                <tr>
                    <th *ngFor="let col of columns">
                        {{col.header}}
                    </th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-rowData let-columns="columns" let-rowIndex="rowIndex">
                <tr [pSelectableRow]="rowData">
                    <td *ngFor="let col of columns">
                        {{rowData[col.field]}}
                    </td>
                </tr>
            </ng-template>
        </p-table>

    </p-tabPanel>
</p-tabView>
