<div class="content-section introduction">
    <div>
        <span class="feature-title">Risultati</span>
        <span>Vista elenco dei tornei dai quali si accede al calendario, risultati e classifiche</span>
    </div>
</div>

<div class="content-section documentation">
<p-accordion>
    <p-accordionTab header="Istruzioni">      
    <p>
        Click sulla riga del torneo per accedere alla vista elenco dei risultati di gironi, playoff ed eliminazioni dirette.
    </p>
    </p-accordionTab>
</p-accordion>    
</div>

<div *ngIf="serverUnreachable" style="margin-top:30px">
    <p-message severity="error" text="Servizio momentaneamente non disponibie. Riprovare più tardi."></p-message>
</div>   

<p-table [columns]="cols" 
    [value]="rows" 
    selectionMode="single" 
    [(selection)]="selectedRow" 
    (onRowSelect)="onRowSelect($event)" >
 
    <ng-template pTemplate="header" let-columns>
        <tr>
            <th *ngFor="let col of columns">
                {{col.header}}
            </th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-rowData let-columns="columns" let-rowIndex="rowIndex">
        <tr [pSelectableRow]="rowData">
            <td *ngFor="let col of columns">
                {{rowData[col.field]}}
            </td>
        </tr>
    </ng-template>

</p-table>
