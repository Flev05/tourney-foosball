<div class="content-section introduction">
    <div>
        <span class="feature-title">Risultati</span>
        <span>Vista elenco dei tornei dai quali si accede ai risultati</span>
    </div>
</div>

<div class="content-section documentation">
<p-accordion>
    <p-accordionTab header="Istruzioni">      
    <p>
        Click sulla riga del torneo per accdere alla vista elenco dei risultati di gironi, playoff ed eliminatorie dirette.
    </p>
    </p-accordionTab>
</p-accordion>    
</div>

<p-table [columns]="cols" 
    [value]="rows" 
    [responsive]="true"
    selectionMode="single" 
    [(selection)]="selectedRow" 
    (onRowSelect)="onRowSelect($event)" >
 
    <ng-template pTemplate="header" let-columns>
        <tr>
            <th *ngFor="let col of columns">
                &#123;&#123;col.header&#125;&#125;
            </th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-rowData let-columns="columns" let-rowIndex="rowIndex">
        <tr [pSelectableRow]="rowData">
            <td *ngFor="let col of columns">
                <span class="ui-column-title">&#123;&#123;col.header&#125;&#125;</span>
                &#123;&#123;rowData[col.field]&#125;&#125;
            </td>
        </tr>
    </ng-template>

</p-table>
